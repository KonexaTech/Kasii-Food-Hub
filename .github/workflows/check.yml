name: Independent marketplace code checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm --prefix worker install --no-audit --no-fund
      - run: npm --prefix worker run check
