name: Verify private QA credentials without deploying
on:
  push:
    branches:
      - 'review/kasii-private-cloudflare-qa-20261123'
    paths:
      - '.github/workflows/qa-private-preflight.yml'
      - 'worker/wrangler.jsonc'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm isolated QA target and private credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const cfg = JSON.parse(readFileSync('worker/wrangler.jsonc', 'utf8'));
          const stop = message => { throw new Error(message); };
          if (cfg.name !== 'kasii-food-hub-api-qa') stop('Wrong QA Worker target');
          if (cfg.workers_dev !== false || cfg.preview_urls !== false) stop('QA routes not safely disabled');
          if (!process.env.CLOUDFLARE_API_TOKEN || process.env.CLOUDFLARE_API_TOKEN.length < 20) stop('CLOUDFLARE_API_TOKEN missing or unusually short');
          const raw = process.env.NEON_DATABASE_URL;
          if (!raw) stop('NEON_DATABASE_URL missing');
          let db;
          try { db = new URL(raw); } catch { stop('NEON_DATABASE_URL malformed'); }
          if (!['postgres:', 'postgresql:'].includes(db.protocol)) stop('Database URL is not PostgreSQL');
          if (!cfg.vars?.EXPECTED_NEON_HOST || db.hostname.toLowerCase() !== cfg.vars.EXPECTED_NEON_HOST.toLowerCase()) stop('Database URL host is not the isolated QA Neon branch');
          console.log('Cloudflare deployment token: present (value hidden).');
          console.log('Neon connection: present and configured QA host matches (value hidden).');
          console.log('Worker route configuration: private/fail-closed.');
          console.log('Preflight complete. No deployment, network or database operations performed.');
          NODE
