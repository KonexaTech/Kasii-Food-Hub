name: Deploy isolated Neon QA API
on:
  push:
    branches: [feature/qa-api-hardening-20261121]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-neon-api-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kasii-food-hub-api-qa
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Run Worker checks
        working-directory: worker
        run: npm run check
      - name: Verify private Cloudflare and isolated Neon deployment targets
        working-directory: worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { assertNeonConnectionTarget } from './src/neon-host.js';
          const cfg = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          const stop = message => { throw new Error(message); };
          if (cfg.workers_dev !== false || cfg.preview_urls !== false) stop('Public Worker and preview routes must remain disabled for initial QA deployment.');
          if (!process.env.CLOUDFLARE_API_TOKEN || !process.env.NEON_DATABASE_URL) stop('Required staging credentials are missing.');
          assertNeonConnectionTarget(process.env.NEON_DATABASE_URL, cfg.vars?.EXPECTED_NEON_HOST, cfg.vars?.EXPECTED_NEON_ROLE);
          const verify = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', {
            headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN }
          });
          let tokenBody = null;
          try { tokenBody = await verify.json(); } catch {}
          if (!verify.ok || tokenBody?.success !== true || tokenBody?.result?.status !== 'active') stop('Cloudflare API token is not active.');
          const workerApi = await fetch('https://api.cloudflare.com/client/v4/accounts/' + cfg.account_id + '/workers/scripts', {
            headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN }
          });
          let workerBody = null;
          try { workerBody = await workerApi.json(); } catch {}
          if (!workerApi.ok || workerBody?.success !== true || !Array.isArray(workerBody?.result)) stop('Cloudflare token cannot access the configured account Worker API.');
          console.log('Private QA route configuration: verified.');
          console.log('Neon target: exact QA branch and restricted Worker role verified (credentials hidden).');
          console.log('Cloudflare token: active and configured-account Worker API access verified (token hidden).');
          console.log('Pre-deployment gate passed. No production target or public route is permitted by this workflow.');
          NODE
      - name: Deploy QA Worker with public routes disabled
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 74fdd987dfadfdbb7322d9fc7f705499
          workingDirectory: worker
          command: deploy --config wrangler.jsonc
      - name: Configure isolated Neon database credential
        working-directory: worker
        shell: bash
        run: printf '%s' "$NEON_DATABASE_URL" | npx wrangler secret put DATABASE_URL --config wrangler.jsonc
