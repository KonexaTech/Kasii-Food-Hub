name: Validate private QA candidate (deployment disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix worker ci --no-audit --no-fund
      - run: npm run check
      - run: npm --prefix worker run check
      - run: npm run build:qa
      - run: echo 'Deployment disabled pending reviewed private Pages-to-Worker transport and credentials. No hosted writes.'
