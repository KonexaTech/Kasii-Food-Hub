name: Frontend acceptance checks
on:
  push:
    branches: [main, feature/kota-style-marketplace-flow]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Worker dependencies for API regression tests
        run: npm --prefix worker ci --no-audit --no-fund
      - name: Run marketplace flow tests
        run: npm test
      - name: Build static preview
        run: npm run build
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser acceptance
        run: npm run test:e2e
